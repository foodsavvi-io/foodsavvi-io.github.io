<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>foodsavvi • fridge</title>
    <link rel="icon" type="image/png" href="assets/icon.png">

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => console.log('SW registered:', registration.scope))
                    .catch(err => console.log('SW registration failed:', err));

    <style>
        @font-face {
            font-family: 'RusticStory';
            src: url('./assets/RusticStory-R9vKM.ttf') format('truetype'),
                 url('./assets/RusticStory-1jDPL.otf') format('opentype');

        }

        }

            font-family: 'RusticStory', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        .back-link {

        .sync-btn {

        .content {

        /* ========== FRIDGE STATUS BOX ========== */
        .fridge-summary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            animation: fadeInScale 0.5s ease;

        }
        .fridge-header {
            display: flex;
            justify-content: space-between;

        }
        .fridge-header h3 {
            font-size: 18px;

        }
        .fridge-header h3 img {
            width: 24px;
            height: 24px;
            object-fit: contain;

        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            text-align: center;
            gap: 12px;
            margin: 20px 0;
        }
        .stat-box {
            flex: 1;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 16px;
            padding: 12px 4px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        .stat-box.good {
            background: rgba(52, 199, 89, 0.2);
            border: 1px solid rgba(52, 199, 89, 0.5);
        }
        .stat-box.expiring {
            background: rgba(255, 149, 0, 0.2);
            border: 1px solid rgba(255, 149, 0, 0.5);
        }
        .stat-box.expired {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.5);
        }
        .stat-box:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.25);
        }
        .stat-box:active {
            transform: scale(0.95);
        }
        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-label {
            font-size: 11px;
            opacity: 0.95;
            white-space: nowrap;
            line-height: 1.3;
        }
        @media (max-width: 360px) {
            .stat-label { font-size: 10px; white-space: normal; }
            .stat-number { font-size: 28px; }
        }
        .stat-box.good .stat-number {
            color: #4cd964;
        }
        .stat-box.expiring .stat-number {
            color: #ffcc00;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .stat-box.expired .stat-number {
            color: #ff6b6b;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }

        .scanner-section {

        #reader {

        }

            color: white;

            border-radius: 20px;
            font-size: 12px;

        .manual-entry-btn {

        /* ========== ADD SECTION ========== */
        .add-section {

            border-radius: 16px;

        }
        .section-title {

        /* ========== ITEMS ========== */
        .items-header {

        .item {

        .item.expiring-soon {

        .item-icon {

        .item-details {

        }

        }
        .item-actions {
            display: flex;

        }
        .item-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: white;

            transition: 0.2s;
        }
        .item-btn:active {
            transform: scale(0.95);
        }
        .edit-btn {

        }
        .delete-btn {

        }
        .empty-state {

        }
        .empty-emoji {

        }
        .add-link {
            display: inline-block;

            padding: 12px 24px;

            color: white;
            text-decoration: none;
            border-radius: 25px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 100%;

        }
        .modal-content h3 {
            margin-bottom: 16px;

        }
        .modal-content input {
            width: 100%;

        .modal-buttons {

        }
        .modal-buttons button {

            border-radius: 12px;

        .modal-buttons .secondary {
            background: #f0f0f0;

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-top: 1px solid #f0f0f0;

            justify-content: space-around;
        }
        .nav-item {
            text-decoration: none;
            color: #999;
            font-size: 12px;

            flex: 1;
        }
        .nav-item.active {

        }
        .nav-emoji {
            font-size: 20px;
            margin-bottom: 2px;
            display: block;
            height: 24px;
            line-height: 24px;
        }
        .nav-emoji img {
            width: auto;
            height: 100%;
            vertical-align: middle;
        }
        
        .notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #34c759;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            transition: 0.3s;
            z-index: 1000;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            pointer-events: none;
        }
        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .notification.success {
            background: #34c759;
        }
        .notification.error {
            background: #ff3b30;
        }
    </style>

<body>
    <div class="app">
        <div class="header">
            <a href="index.html" class="back-link">←</a>
            <h1>my fridge</h1>
            <button class="sync-btn" onclick="syncWithCloud()">↻</button>
        </div>
        
        <div class="content">
            <!-- FRIDGE STATUS BOX -->
            <div class="fridge-summary">
                <div class="fridge-header">
                    <h3><img src="assets/fridge.png" alt="fridge"> fridge status</h3>
                </div>
                <div class="stats-row">
                    <div class="stat-box good">
                        <div class="stat-number" id="totalItems">0</div>
                        <div class="stat-label">good ✅</div>
                    </div>
                    <div class="stat-box expiring">
                        <div class="stat-number" id="expiringItems">0</div>
                        <div class="stat-label">expiring soon ⚠️</div>
                    </div>
                    <div class="stat-box expired">
                        <div class="stat-number" id="expiredItems">0</div>
                        <div class="stat-label">expired ❌</div>

            </div>
            
            <!-- BARCODE SCANNER -->
            <div class="scanner-section">

                </div>

                </button>

            <!-- ADD SECTION -->
            <div class="add-section">

                <!-- Items loaded here -->
            </div>

        <!-- Bottom navigation -->
        <div class="bottom-nav">

            </a>
            <a href="find-stores.html" class="nav-item">
                <span class="nav-emoji">🔍</span>
                <span>deals</span>
            </a>
            <a href="shoplist.html" class="nav-item">
                <span class="nav-emoji">📝</span>
                <span>lists</span>
            </a>

                <span class="nav-emoji"><img src="assets/fridge.png" alt="fridge"></span>
                <span>fridge</span>
            </a>
        </div>
    </div>
    
    <!-- Edit Expiry Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h3>✏️ edit expiry date</h3>
            <input type="date" id="editExpiryDate" class="edit-input">
            <div class="modal-buttons">
                <button class="primary" onclick="saveEditExpiry()">save</button>
                <button class="secondary" onclick="closeEditModal()">cancel</button>
            </div>
        </div>
    </div>
    
    <div class="notification" id="notification"></div>
    
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="backend.js"></script>
    
    <script>
        // ===== PRODUCT DATABASE FOR BARCODE SCANNING =====
        const productDatabase = {
            "8901234567890": { name: "Amul Milk" },
            "8901234567891": { name: "Britannia Bread" },
            "8901234567892": { name: "Nestle Maggi" },
            "8901234567893": { name: "Dove Soap" },
            "8901234567894": { name: "Patanjali Atta" },
            "8901234567895": { name: "Amul Butter" },
            "8901234567896": { name: "Tata Salt" },
            "8901234567897": { name: "Coca Cola" },
            "8901234567898": { name: "Lays Chips" },
            "8901234567899": { name: "Kissan Jam" },
            "123456789012": { name: "Organic Milk" },
            "123456789013": { name: "Free Range Eggs" },
            "123456789014": { name: "Sourdough Bread" },
            "123456789015": { name: "Chicken Breast" },
            "123456789016": { name: "Broccoli" },
            "123456789017": { name: "Bananas" },
            "123456789018": { name: "Greek Yogurt" },
            "123456789019": { name: "Frozen Pizza" }
        };

        let html5QrCode = null;
        let isScanning = false;
        let sortAscending = true;
        let items = [];
        let editingIndex = -1;
        let notificationTimeout = null;
        
        const commonFoods = [
            "Milk", "Eggs", "Bread", "Rice", "Chicken",
            "Beef", "Apples", "Bananas", "Cheese", "Yogurt"
        ];
        
        document.addEventListener("DOMContentLoaded", async function() {
            const user = Backend.getCurrentUser();
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            await loadFridge();
            populateDropdown();
            displayItems();
            // Set default expiry to 7 days from now
            const today = new Date();
            const nextWeek = new Date();
            nextWeek.setDate(today.getDate() + 7);
            document.getElementById('expiryDate').value = nextWeek.toISOString().split('T')[0];
        });
        
        async function loadFridge() {
            try {
                const cloudItems = await Backend.loadFridgeItems();
                if (cloudItems && cloudItems.length > 0) {
                    items = cloudItems;
                } else {
                    items = JSON.parse(localStorage.getItem("foodItems")) || [];
                }
            } catch (error) {
                items = JSON.parse(localStorage.getItem("foodItems")) || [];
            }
        }
        
        async function saveFridge() {
            try {
                await Backend.saveFridgeItems(items);
                localStorage.setItem("foodItems", JSON.stringify(items));
            } catch (error) {
                localStorage.setItem("foodItems", JSON.stringify(items));
            }
        }
        
        function populateDropdown() {
            const dropdown = document.getElementById("foodDropdown");
            dropdown.innerHTML = '<option value="">Select food</option>';
            const pastItems = items.map(item => item.name);
            const allFoods = [...new Set([...commonFoods, ...pastItems])].sort();
            
            allFoods.forEach(food => {
                const option = document.createElement("option");
                option.value = food;
                option.textContent = food;
                dropdown.appendChild(option);
            });
        }
        
        async function addItem() {
            const name = document.getElementById("foodName").value.trim() || document.getElementById("foodDropdown").value;
            const expiry = document.getElementById("expiryDate").value;
            
            if (!name || !expiry) {
                showNotification("Please fill all fields", "error");
                return;
            }
            
            items.push({ name, expiry, addedDate: new Date().toISOString() });
            await saveFridge();
            
            document.getElementById("foodName").value = "";
            document.getElementById("foodDropdown").value = "";
            document.getElementById("expiryDate").value = "";
            
            populateDropdown();
            displayItems();
            showNotification(`Added ${name}`, "success");
        }
        
        async function deleteItem(index) {
            if (confirm("Remove this item?")) {
                items.splice(index, 1);
                await saveFridge();
                populateDropdown();
                displayItems();
                showNotification("Item removed", "success");
            }
        }
        
        function editItem(index) {
            editingIndex = index;
            const item = items[index];
            document.getElementById("editExpiryDate").value = item.expiry;
            document.getElementById("editModal").classList.add("show");
        }
        
        async function saveEditExpiry() {
            const newExpiry = document.getElementById("editExpiryDate").value;
            
            if (!newExpiry) {
                showNotification("Please select a date", "error");
                return;
            }
            
            if (editingIndex >= 0 && editingIndex < items.length) {
                items[editingIndex].expiry = newExpiry;
                await saveFridge();
                displayItems();
                showNotification(`Expiry updated`, "success");
            }
            
            closeEditModal();
        }
        
        function closeEditModal() {
            document.getElementById("editModal").classList.remove("show");
            editingIndex = -1;
        }
        
        function toggleSort() {
            sortAscending = !sortAscending;
            displayItems();
        }
        
        function displayItems() {
            const container = document.getElementById("itemsContainer");
            
            updateStats(items);
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-emoji">🧊</div>
                        <div>your fridge is empty</div>
                        <a href="#" class="add-link" onclick="document.getElementById('foodName').focus()">➕ add items</a>
                    </div>
                `;
                return;
            }
            
            const sortedItems = [...items].sort((a, b) => {
                return sortAscending ? new Date(a.expiry) - new Date(b.expiry) : new Date(b.expiry) - new Date(a.expiry);
            });
            
            container.innerHTML = sortedItems.map((item, index) => {
                const originalIndex = items.findIndex(i => i.name === item.name && i.expiry === item.expiry && i.addedDate === item.addedDate);
                const today = new Date();
                today.setHours(0,0,0,0);
                const expiry = new Date(item.expiry);
                expiry.setHours(0,0,0,0);
                const diffDays = Math.round((expiry - today) / (1000*60*60*24));
                
                let statusClass = "";
                let statusText = "";
                let badgeClass = "good";
                
                if (diffDays < 0) {
                    statusClass = "expired";
                    statusText = `expired ${Math.abs(diffDays)} days ago`;
                    badgeClass = "expired";
                } else if (diffDays === 0) {
                    statusClass = "expiring-soon";
                    statusText = `expires TODAY!`;
                    badgeClass = "warning";
                } else if (diffDays <= 3) {
                    statusClass = "expiring-soon";
                    statusText = `${diffDays} days left`;
                    badgeClass = "warning";
                } else {
                    statusText = `${diffDays} days left`;
                    badgeClass = "good";
                }
                
                const foodEmoji = getFoodEmoji(item.name);
                
                return `
                    <div class="item ${statusClass}">
                        <div class="item-icon">${foodEmoji}</div>
                        <div class="item-details">
                            <div class="item-name">${escapeHtml(item.name)}</div>
                            <div class="item-expiry">
                                <span>📅 ${item.expiry}</span>
                                <span class="days-badge ${badgeClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="item-btn edit-btn" onclick="editItem(${originalIndex})">✏️</button>
                            <button class="item-btn delete-btn" onclick="deleteItem(${originalIndex})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getFoodEmoji(name) {
            name = name.toLowerCase();
            if (name.includes('milk') || name.includes('cheese') || name.includes('yogurt')) return '🥛';
            if (name.includes('egg')) return '🥚';
            if (name.includes('bread')) return '🍞';
            if (name.includes('chicken') || name.includes('beef') || name.includes('pork') || name.includes('fish')) return '🥩';
            if (name.includes('apple')) return '🍎';
            if (name.includes('banana')) return '🍌';
            if (name.includes('rice')) return '🍚';
            if (name.includes('pasta')) return '🍝';
            if (name.includes('carrot') || name.includes('lettuce') || name.includes('tomato')) return '🥬';
            return '🍽️';
        }
        
        function updateStats(items) {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            let expiring = 0, expired = 0;
            
            items.forEach(item => {
                const expiry = new Date(item.expiry);
                expiry.setHours(0,0,0,0);
                const diff = Math.round((expiry - today) / (1000*60*60*24));
                
                if (diff < 0) expired++;
                else if (diff <= 3) expiring++;
            });
            
            document.getElementById('totalItems').textContent = items.length;
            document.getElementById('expiringItems').textContent = expiring;
            document.getElementById('expiredItems').textContent = expired;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function syncWithCloud() {
            showNotification("Syncing...", "info");
            await saveFridge();
            await loadFridge();
            displayItems();
            showNotification("Synced!", "success");
        }
        
        // ===== BARCODE SCANNER FUNCTIONS =====
        async function startScanner() {
            const scannerContainer = document.getElementById('scannerContainer');
            scannerContainer.classList.add('active');
            
            if (html5QrCode === null) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            if (!isScanning) {
                try {
                    isScanning = true;
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 10,
                            qrbox: { width: 250, height: 250 }
                        },
                        onScanSuccess,
                        onScanError
                    );
                    showNotification('Scanner started. Point camera at barcode.', 'info');
                } catch (err) {
                    console.error("Failed to start scanner:", err);
                    showNotification('Could not start camera. Please check permissions.', 'error');
                    isScanning = false;
                }
            }
        }
        
        async function stopScanner() {
            if (html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    isScanning = false;
                    const scannerContainer = document.getElementById('scannerContainer');
                    scannerContainer.classList.remove('active');
                    showNotification('Scanner stopped', 'info');
                } catch (err) {
                    console.error("Failed to stop scanner:", err);
                }
            } else {
                const scannerContainer = document.getElementById('scannerContainer');
                scannerContainer.classList.remove('active');
            }
        }
        
        function hideScanner() {
            stopScanner();
        }
        
        async function onScanSuccess(decodedText, decodedResult) {
            console.log(`Scanned barcode: ${decodedText}`);
            stopScanner();
            
            const product = productDatabase[decodedText];
            
            if (product) {
                document.getElementById('foodName').value = product.name;
                document.getElementById('foodName').classList.add('filled-by-scanner');
                
                // Set expiry to 7 days from now
                const today = new Date();
                const nextWeek = new Date();
                nextWeek.setDate(today.getDate() + 7);
                document.getElementById('expiryDate').value = nextWeek.toISOString().split('T')[0];
                
                setTimeout(() => {
                    document.getElementById('foodName').classList.remove('filled-by-scanner');
                }, 1000);
                
                showNotification(`✅ Found: ${product.name}`, 'success');
                await fetchProductInfo(decodedText);
            } else {
                showNotification(`⚠️ Product not found. Please enter details manually.`, 'info');
                await fetchProductInfo(decodedText);
            }
        }
        
        async function fetchProductInfo(barcode) {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await response.json();
                
                if (data.status === 1 && data.product) {
                    const product = data.product;
                    
                    if (product.product_name) {
                        document.getElementById('foodName').value = product.product_name;
                        document.getElementById('foodName').classList.add('filled-by-scanner');
                        setTimeout(() => document.getElementById('foodName').classList.remove('filled-by-scanner'), 1000);
                    }
                    
                    showNotification(`📦 Found product info from online database!`, 'success');
                    
                    if (product.image_url) {
                        fetchImageAsBase64(product.image_url);
                    }
                }
            } catch (error) {
                console.log('Online lookup failed:', error);
            }
        }
        
        async function fetchImageAsBase64(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = function() {
                    // Store image as base64 if needed
                    console.log("Image fetched (not stored in fridge)");
                };
                reader.readAsDataURL(blob);
            } catch (error) {
                console.log('Could not fetch product image:', error);
            }
        }
        
        function onScanError(errorMessage) {
            // Silently ignore
        }
        
        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            if (notificationTimeout) clearTimeout(notificationTimeout);
            notif.textContent = message;
            notif.className = `notification show ${type}`;
            notificationTimeout = setTimeout(() => {
                notif.className = 'notification';
                notificationTimeout = null;
            }, 2000);
        }
        
        // Expose global functions
        window.addItem = addItem;
        window.deleteItem = deleteItem;
        window.editItem = editItem;
        window.saveEditExpiry = saveEditExpiry;
        window.closeEditModal = closeEditModal;
        window.toggleSort = toggleSort;
        window.syncWithCloud = syncWithCloud;
        window.startScanner = startScanner;
        window.stopScanner = stopScanner;
        window.hideScanner = hideScanner;
        window.onScanSuccess = onScanSuccess;
    </script>
</body>
</html>
